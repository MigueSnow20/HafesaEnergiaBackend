spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
petroxpert.market.provider=${MARKET_PROVIDER:playwright}
petroxpert.market.refresh-interval=${MARKET_REFRESH:5s}
petroxpert.market.stale-after=${MARKET_STALE_AFTER:20s}
petroxpert.market.source-timeout=${MARKET_TIMEOUT:8s}
petroxpert.market.max-backoff=${MARKET_MAX_BACKOFF:5m}
petroxpert.market.enabled=${MARKET_ENABLED:true}
legacy.base-url=${LEGACY_BASE_URL:}
legacy.timeout=${LEGACY_TIMEOUT:PT8S}
legacy.refresh=${LEGACY_REFRESH:PT15S}
legacy.stale-after=${LEGACY_STALE_AFTER:PT45S}
legacy.max-backoff=${LEGACY_MAX_BACKOFF:PT5M}
web.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging.level.com.petroxpert.ms.services.market.MarketCollector=WARN
